# Vitrine GitHub Pages. Squelette commun aux trois dépôts (map3D, panels, IA Studio) :
# mêmes déclencheurs, mêmes versions d'actions, même garde-fou avant publication, même
# artefact `_site`.
#
# Source Pages = GitHub Actions, jamais une branche : rien de compilé n'est versionné,
# tout est rebâti à chaque push sur `main`.
name: Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'src/**'
      - 'examples/**'
      - 'scripts/**'
      - 'repo.config.json'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/pages.yml'
  # Les mêmes chemins en pull request : on bâtit sans déployer, pour qu'une vitrine
  # cassée se voie avant la fusion et non après.
  pull_request:
    paths:
      - 'site/**'
      - 'src/**'
      - 'examples/**'
      - 'scripts/**'
      - 'repo.config.json'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un seul déploiement à la fois, sans annuler celui en cours : une publication à moitié
# écrite est pire qu'une publication en retard.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # La vitrine n'est publiée que si la librairie qu'elle démontre tient debout.
      - run: pnpm validate

      # Une seule commande bâtit tout le site : les cinq démos et les quinze langues. Les
      # chemins de sortie vivent dans `repo.config.json`, pas ici.
      - run: pnpm build:site

      - uses: actions/configure-pages@v6
        if: github.ref == 'refs/heads/main'

      - uses: actions/upload-pages-artifact@v5
        if: github.ref == 'refs/heads/main'
        with:
          path: _site

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
